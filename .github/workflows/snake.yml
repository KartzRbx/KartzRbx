name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: KartzRbx
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2310B981&color_dots=%230a1612,%23042F2E,%23065F46,%23059669,%2310B981
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2334D399&color_dots=%230a1612,%23042F2E,%23065F46,%23059669,%2310B981

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
